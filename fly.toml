app = "market-bubble-live-desk"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_MODE = "1"
  HISTORY_LIMIT = "500"
  HOST = "0.0.0.0"
  PORT = "8899"
  TEXT_REPEAT_SUPPRESS_MS = "120000"
  WORKSPACE_NAME = "Market Bubble Live Desk"

[http_service]
  internal_port = 8899
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100
