services:
  - type: web
    name: market-bubble-live-desk
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: operator-state
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "1"
      - key: HISTORY_LIMIT
        value: "500"
      - key: TEXT_REPEAT_SUPPRESS_MS
        value: "120000"
      - key: WORKSPACE_NAME
        value: Market Bubble Live Desk
      - key: TWITCH_CHANNELS
        sync: false
      - key: TWITCH_USERNAME
        sync: false
      - key: TWITCH_TOKEN
        sync: false
      - key: KICK_CHANNELS
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_RULES
        sync: false
